apiVersion: tapyr/v1alpha1
kind: Scenario
metadata:
  name: bad-day
  description: Another client eats the quota, then the device listing fails intermittently.
spec:
  steps:
    - at: 0s
      externalConsumption: { limit: daily, ratePerHour: 60 }
    - at: 2h
      for: 20m
      errors: { routes: ["/devices"], status: 503, ratio: 0.3 }
