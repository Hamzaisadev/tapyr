apiVersion: tapyr/v1alpha1
kind: Simulation
metadata:
  name: meraki-dashboard
spec:
  # tapyr sim --all serves this simulator at --listen-base plus this offset.
  portOffset: 2
  # A synthetic Dashboard: 2 organizations of 4 networks of 10 devices (one
  # appliance, three switches, six access points). Fields follow the
  # official OpenAPI description (v1.75.1).
  basePath: /api/v1
  inventory:
    seed: 42
    sets:
      - { name: organizations, count: 2 }
      - { name: networks, parent: organizations, count: 4 }
      - { name: devices, parent: networks, count: 10 }
  auth:
    accept:
      bearer: [sim-meraki-key]
  routes:
    - path: /organizations
      pagination: link_header
      response: { template: fixtures/organizations.json.tmpl }
    - path: /organizations/{organizationId}/networks
      pagination: link_header
      response: { template: fixtures/networks.json.tmpl }
    - path: /organizations/{organizationId}/devices
      pagination: link_header
      response: { template: fixtures/devices.json.tmpl }
    - path: /organizations/{organizationId}/devices/availabilities
      pagination: link_header
      response: { template: fixtures/availabilities.json.tmpl }
    - path: /organizations/{organizationId}/appliance/uplink/statuses
      pagination: link_header
      response: { template: fixtures/uplinks.json.tmpl }
    - path: /organizations/{organizationId}/wireless/clients/overview/byDevice
      pagination: link_header
      response: { template: fixtures/clients.json.tmpl, itemsField: items }
