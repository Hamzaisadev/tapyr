# Contract test of aruba-central-classic: every template once against the
# simulator ($SIM_URL), through the auth plugin and its refresh endpoint.
apiVersion: tapyr/v1alpha1
kind: Account
metadata: { name: contract }
spec:
  provider: aruba-central-classic
  params: { baseURL: "$SIM_URL" }
  secrets:
    clientId: { env: ARUBA_CLIENT_ID }
    clientSecret: { env: ARUBA_CLIENT_SECRET }
    refreshToken: { env: ARUBA_REFRESH_TOKEN }
---
apiVersion: tapyr/v1alpha1
kind: Job
metadata: { name: aps }
spec: { account: contract, template: aruba-aps }
---
apiVersion: tapyr/v1alpha1
kind: Job
metadata: { name: switches }
spec: { account: contract, template: aruba-switches }
---
apiVersion: tapyr/v1alpha1
kind: Job
metadata: { name: gateways }
spec: { account: contract, template: aruba-gateways }
---
apiVersion: tapyr/v1alpha1
kind: Job
metadata: { name: sites }
spec: { account: contract, template: aruba-sites }
