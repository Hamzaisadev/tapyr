apiVersion: tapyr/v1alpha1
kind: JobTemplate
metadata:
  name: aruba-switches
spec:
  provider: aruba-central-classic
  defaultInterval: 15m
  defaultPriority: normal
  request:
    path: /monitoring/v1/switches
    query: { calculate_total: "true" }
  estimate:
    pagesPerRun: 1
  extract:
    items: response.body.switches
    metrics:
      - name: aruba_switch_up
        help: Switch status (1 Up, 0 Down)
        value: "default(item.status, '') == 'Up'"
        labels: { serial: item.serial }
    info:
      - name: aruba_switch_info
        help: Descriptive attributes of a switch
        labels:
          serial: item.serial
          name: "default(item.name, '')"
          model: "default(item.model, '')"
          firmware: "default(item.firmware_version, '')"
          group: "default(item.group_name, '')"
          site: "default(item.site, '')"
          switch_type: "default(item.switch_type, '')"
