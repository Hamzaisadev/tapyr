apiVersion: tapyr/v1alpha1
kind: Scenario
metadata:
  name: bad-day
  description: >-
    The RMS API has a bad day: slow responses, then intermittent 503 on the
    device list, then a short outage.
spec:
  steps:
    - at: 1h
      for: 1h
      latency: { p50: 800ms, p99: 6s }
    - at: 2h
      for: 30m
      errors: { routes: ["/devices"], status: 503, ratio: 0.3 }
    - at: 4h
      for: 10m
      outage: true
