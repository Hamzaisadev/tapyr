apiVersion: tapyr/v1alpha1
kind: Scenario
metadata:
  name: bad-day
  description: >-
    The router reboots after a firmware update: it stops answering for 5
    minutes, then every session opened before is invalid; from 2h, half of
    the modem requests fail with 500 for 30 minutes.
spec:
  steps:
    - at: 1h
      for: 5m
      outage: true
    - at: 1h5m
      tokenExpiry: true
    - at: 2h
      for: 30m
      errors: { routes: ["/modems/**"], status: 500, ratio: 0.5 }
